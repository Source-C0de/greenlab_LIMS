openapi: 3.1.0
info:
  title: GreenLabLIMS KSA API
  version: 1.0.0
  summary: REST + JSON contract for the GreenLabLIMS KSA single-tenant LIMS backend.
  description: |
    Backend API contract for the GreenLabLIMS KSA React SPA.

    - All paths are prefixed with `/api/v1`.
    - Auth is via httpOnly cookie `glims_session` (see README.md#auth).
    - State-changing requests must include `X-CSRF-Token` header
      echoing the non-HttpOnly `glims_csrf` cookie (see README.md#csrf).
    - Single-tenant deployment in v1; the `tenants` table exists as a
      one-row singleton (`id = "default"`). Optional `tenant_id`
      column is included on domain tables for forward compatibility
      (see gaps.md#g7).
    - Field-level shapes mirror the TypeScript types in
      `src/mock-data/*.ts`. See data-model.md for the full field
      reference.

    Out of scope for v1: audit log UI, server-side PDF generation,
    WebSocket/SSE notifications, multi-tenant scoping.
  contact:
    name: GreenLabLIMS Backend Team
    email: backend@greenlablims.example
  license:
    name: Proprietary

servers:
  - url: https://api.greenlablims.example.com/api/v1
    description: Production
  - url: http://localhost:8000/api/v1
    description: Local development

tags:
  - name: Auth
    description: Login, logout, session, password reset, OTP.
  - name: Tenants
    description: Tenant CRUD (superadmin only). v1 ships as a single-row singleton.
  - name: SaaS Admin
    description: Plans, feature flags, permissions matrix (superadmin only).
  - name: Clients
    description: Customer/client CRUD.
  - name: Samples
    description: Sample lifecycle — receive, status, report, timeline.
  - name: Tests
    description: Per-sample tests, parameters, approval workflow.
  - name: Reports
    description: Reports generated from fully-approved samples.
  - name: Invoices
    description: Invoicing + ZATCA FATOORA reporting.
  - name: Accounting
    description: Chart of accounts, journal entries, ledger, financial reports.
  - name: Specifications
    description: Reusable test bundles (parameters + ranges).
  - name: Inventory
    description: Reagents and inventory alerts.
  - name: Analysts
    description: Lab staff who perform tests.
  - name: Notifications
    description: In-app notifications.
  - name: Health
    description: Liveness, readiness, version.

# ============================================================================
# SECURITY
# ============================================================================
security:
  - cookieAuth: []

# ============================================================================
# PATHS
# ============================================================================
paths:

  # --------------------------------------------------------------------------
  # Auth
  # --------------------------------------------------------------------------
  /auth/login:
    post:
      tags: [Auth]
      summary: Username or email + password login (sets `glims_session` cookie)
      security: []
      x-csrf: false
      operationId: authLogin
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Login successful. Set-Cookie header carries `glims_session` + `glims_csrf`.
          headers:
            Set-Cookie:
              schema: { type: string }
              description: |
                Two cookies:
                `glims_session=<JWT>; HttpOnly; Secure; SameSite=Lax; Path=/; Max-Age=86400`
                `glims_csrf=<token>; Secure; SameSite=Lax; Path=/; Max-Age=86400`
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/DataEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/LoginResponse" }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/superadmin/login:
    post:
      tags: [Auth]
      summary: Superadmin-scope login (username or email + password; separate cookie `glims_sa_session`)
      security: []
      x-csrf: false
      operationId: authSuperadminLogin
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Superadmin login successful.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/DataEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/LoginResponse" }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout (clears `glims_session`)
      operationId: authLogout
      x-csrf: true
      responses:
        "204":
          description: Logged out.
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/superadmin/logout:
    post:
      tags: [Auth]
      summary: Logout of the superadmin session
      operationId: authSuperadminLogout
      x-csrf: true
      responses:
        "204":
          description: Logged out.
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/me:
    get:
      tags: [Auth]
      summary: Current user (called by SPA on mount and after auth events)
      operationId: authMe
      responses:
        "200":
          description: Current user.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/DataEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/User" }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/register:
    post:
      tags: [Auth]
      summary: New tenant/lab access request
      security: []
      x-csrf: false
      operationId: authRegister
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "201":
          description: Request accepted. Admin will review.
        "400":
          $ref: "#/components/responses/ValidationError"
        "409":
          $ref: "#/components/responses/Conflict"

  /auth/password/forgot:
    post:
      tags: [Auth]
      summary: Initiate password reset (triggers email with OTP)
      security: []
      x-csrf: false
      operationId: authPasswordForgot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "202":
          description: Email sent if account exists. Never confirms existence.
        "400":
          $ref: "#/components/responses/ValidationError"

  /auth/otp/verify:
    post:
      tags: [Auth]
      summary: Verify OTP code → session cookie
      security: []
      x-csrf: false
      operationId: authOtpVerify
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, otp]
              properties:
                email: { type: string, format: email }
                otp: { type: string, minLength: 4, maxLength: 8 }
      responses:
        "200":
          description: OTP verified; session cookie set.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/DataEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/LoginResponse" }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/otp/resend:
    post:
      tags: [Auth]
      summary: Resend OTP code
      security: []
      x-csrf: false
      operationId: authOtpResend
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "202":
          description: Resent (or silently no-op if account doesn't exist).
        "400":
          $ref: "#/components/responses/ValidationError"

  # --------------------------------------------------------------------------
  # Tenants (superadmin)
  # --------------------------------------------------------------------------
  /admin/tenants:
    get:
      tags: [Tenants]
      summary: List tenants
      operationId: tenantsList
      parameters:
        - $ref: "#/components/parameters/Q"
        - in: query
          name: plan
          schema: { $ref: "#/components/schemas/PlanCode" }
        - in: query
          name: status
          schema: { $ref: "#/components/schemas/TenantStatus" }
        - in: query
          name: includeDeleted
          schema: { type: boolean, default: false }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Paginated tenants.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedEnvelope"
                  - properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Tenant" }
    post:
      tags: [Tenants]
      summary: Create a tenant
      operationId: tenantsCreate
      x-csrf: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TenantCreateRequest" }
      responses:
        "201":
          description: Tenant created.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/DataEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/Tenant" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "409": { $ref: "#/components/responses/Conflict" }

  /admin/tenants/export:
    get:
      tags: [Tenants]
      summary: Export tenants as CSV or JSON
      operationId: tenantsExport
      parameters:
        - in: query
          name: format
          required: true
          schema: { type: string, enum: [csv, json] }
      responses:
        "200":
          description: File download.
          content:
            text/csv:
              schema: { type: string, format: binary }
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Tenant" }

  /admin/tenants/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Tenants]
      summary: Get one tenant
      operationId: tenantsGet
      responses:
        "200":
          description: Tenant.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/DataEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/Tenant" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Tenants]
      summary: Replace tenant fields
      operationId: tenantsReplace
      x-csrf: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TenantUpdateRequest" }
      responses:
        "200":
          description: Tenant updated.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/DataEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/Tenant" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Tenants]
      summary: Soft-delete a tenant
      operationId: tenantsDelete
      x-csrf: true
      responses:
        "204": { description: Soft-deleted. }

  /admin/tenants/{id}/status:
    parameters:
      - $ref: "#/components/parameters/Id"
    patch:
      tags: [Tenants]
      summary: Lifecycle change (active | trial | suspended | cancelled)
      operationId: tenantsChangeStatus
      x-csrf: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: "#/components/schemas/TenantStatus" }
                reason: { type: string }
      responses:
        "200":
          description: Status changed.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/DataEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/Tenant" }

  /admin/tenants/{id}/plan:
    parameters:
      - $ref: "#/components/parameters/Id"
    patch:
      tags: [Tenants]
      summary: Change plan (optionally prorated)
      operationId: tenantsChangePlan
      x-csrf: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [planCode]
              properties:
                planCode: { $ref: "#/components/schemas/PlanCode" }
                prorated: { type: boolean, default: false }
      responses:
        "200":
          description: Plan changed.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/DataEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/Tenant" }

  # --------------------------------------------------------------------------
  # SaaS admin — plans, feature flags, permissions
  # --------------------------------------------------------------------------
  /admin/plans:
    get:
      tags: [SaaS Admin]
      summary: List pricing plans
      operationId: plansList
      responses:
        "200":
          description: All active plans.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/DataEnvelope"
                  - properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Plan" }

  /admin/feature-flags:
    get:
      tags: [SaaS Admin]
      summary: List feature flags
      operationId: featureFlagsList
      responses:
        "200":
          description: All feature flags.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/DataEnvelope"
                  - properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/FeatureFlag" }

  /admin/feature-flags/{key}:
    parameters:
      - in: path
        name: key
        required: true
        schema: { type: string }
    patch:
      tags: [SaaS Admin]
      summary: Toggle a feature flag
      operationId: featureFlagsUpdate
      x-csrf: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        "200":
          description: Flag updated.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/DataEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/FeatureFlag" }

  /admin/permissions/matrix:
    get:
      tags: [SaaS Admin]
      summary: Full role × menu-item permission matrix
      operationId: permissionsMatrix
      responses:
        "200":
          description: The matrix.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/DataEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/PermissionMatrix" }

  /admin/permissions/menu-items/{menuItemId}:
    parameters:
      - in: path
        name: menuItemId
        required: true
        schema: { type: string }
    put:
      tags: [SaaS Admin]
      summary: Replace which roles see this menu item (atomic)
      operationId: permissionsReplaceForMenuItem
      x-csrf: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roleCodes]
              properties:
                roleCodes:
                  type: array
                  items: { $ref: "#/components/schemas/Role" }
                applyToChildren:
                  type: boolean
                  default: false
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/DataEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/PermissionMatrix" }

  /admin/permissions/bulk:
    post:
      tags: [SaaS Admin]
      summary: Bulk toggle matrix cells (one transaction)
      operationId: permissionsBulkUpdate
      x-csrf: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [changes]
              properties:
                changes:
                  type: array
                  items:
                    type: object
                    required: [menuItemId, roleCode, enabled]
                    properties:
                      menuItemId: { type: string }
                      roleCode: { $ref: "#/components/schemas/Role" }
                      enabled: { type: boolean }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/DataEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/PermissionMatrix" }

  # --------------------------------------------------------------------------
  # Clients
  # --------------------------------------------------------------------------
  /clients:
    get:
      tags: [Clients]
      summary: List clients (paginated, filterable)
      operationId: clientsList
      parameters:
        - $ref: "#/components/parameters/Q"
        - in: query
          name: type
          schema: { type: string }
        - in: query
          name: city
          schema: { type: string }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Paginated clients.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedEnvelope"
                  - properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Client" }
    post:
      tags: [Clients]
      summary: Create a client
      operationId: clientsCreate
      x-csrf: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClientCreateRequest" }
      responses:
        "201":
          description: Client created.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/DataEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/Client" }
        "400": { $ref: "#/components/responses/ValidationError" }

  /clients/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Clients]
      summary: Get one client
      operationId: clientsGet
      responses:
        "200":
          description: Client.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/DataEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/Client" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Clients]
      summary: Partial update
      operationId: clientsUpdate
      x-csrf: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClientUpdateRequest" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/DataEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/Client" }
    delete:
      tags: [Clients]
      summary: Soft-delete
      operationId: clientsDelete
      x-csrf: true
      responses:
        "204": { description: Soft-deleted. }

  # --------------------------------------------------------------------------
  # Samples
  # --------------------------------------------------------------------------
  /samples:
    get:
      tags: [Samples]
      summary: List samples
      operationId: samplesList
      parameters:
        - $ref: "#/components/parameters/Q"
        - in: query
          name: status
          schema: { $ref: "#/components/schemas/SampleStatus" }
        - in: query
          name: priority
          schema: { $ref: "#/components/schemas/Priority" }
        - in: query
          name: clientId
          schema: { type: string }
        - in: query
          name: sortBy
          schema: { type: string, enum: [receivedDate, priority, status, id], default: receivedDate }
        - in: query
          name: sortOrder
          schema: { type: string, enum: [asc, desc], default: desc }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Paginated samples.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedEnvelope"
                  - properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/SampleSummary" }
    post:
      tags: [Samples]
      summary: Receive a new sample (server mints `<PREFIX>/<YYYY>/<NNNN>` id)
      operationId: samplesCreate
      x-csrf: true
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string }
          description: Client-generated UUID to prevent double-submit on retry.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SampleCreateRequest" }
      responses:
        "201":
          description: Sample received.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/DataEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/Sample" }
        "400": { $ref: "#/components/responses/ValidationError" }

  /samples/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Samples]
      summary: Get a sample with its tests
      operationId: samplesGet
      responses:
        "200":
          description: Full sample.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/DataEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/Sample" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Samples]
      summary: Partial update (metadata)
      operationId: samplesUpdate
      x-csrf: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SampleUpdateRequest" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/DataEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/Sample" }
    delete:
      tags: [Samples]
      summary: Soft-delete
      operationId: samplesDelete
      x-csrf: true
      responses:
        "204": { description: Soft-deleted. }

  /samples/{id}/status:
    parameters:
      - $ref: "#/components/parameters/Id"
    patch:
      tags: [Samples]
      summary: Move a sample between Kanban columns
      operationId: samplesChangeStatus
      x-csrf: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: "#/components/schemas/SampleStatus" }
                assignedAnalyst: { type: string, nullable: true }
      responses:
        "200":
          description: Status changed.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/DataEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/Sample" }

  /samples/{id}/report:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Samples]
      summary: Render-ready sample for COA
      operationId: samplesGetReport
      responses:
        "200":
          description: COA-ready sample view.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/DataEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/SampleReport" }

  /samples/{id}/timeline:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Samples]
      summary: Stage history for the sample
      operationId: samplesGetTimeline
      responses:
        "200":
          description: Timeline events.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/DataEnvelope"
                  - properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/TimelineEvent" }

  /samples/{id}/receiving-label.pdf:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [Samples]
      summary: Generate printable receiving label (server-side, optional)
      operationId: samplesGenerateReceivingLabel
      x-csrf: true
      responses:
        "200":
          description: PDF.
          content:
            application/pdf:
              schema: { type: string, format: binary }

  # --------------------------------------------------------------------------
  # Tests (under a sample)
  # --------------------------------------------------------------------------
  /samples/{sampleId}/tests:
    parameters:
      - in: path
        name: sampleId
        required: true
        schema: { type: string }
    post:
      tags: [Tests]
      summary: Add a test to a sample
      operationId: testsAdd
      x-csrf: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TestCreateRequest" }
      responses:
        "201":
          description: Test added.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/DataEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/Test" }
    get:
      tags: [Tests]
      summary: List tests for a sample
      operationId: testsListForSample
      parameters:
        - in: query
          name: reviewStatus
          schema: { $ref: "#/components/schemas/TestReviewStatus" }
        - in: query
          name: assignedTo
          schema: { type: string }
      responses:
        "200":
          description: Tests.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/DataEnvelope"
                  - properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Test" }

  /samples/{sampleId}/tests/replicate:
    parameters:
      - in: path
        name: sampleId
        required: true
        schema: { type: string }
    post:
      tags: [Tests]
      summary: Clone existing tests into this sample
      operationId: testsReplicate
      x-csrf: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fromTestIds]
              properties:
                fromTestIds:
                  type: array
                  items: { type: string }
                  maxItems: 100
      responses:
        "200":
          description: Cloned tests.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/DataEnvelope"
                  - properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Test" }

  /tests/queue:
    get:
      tags: [Tests]
      summary: Reviewer queue
      operationId: testsQueue
      parameters:
        - in: query
          name: priority
          schema: { $ref: "#/components/schemas/Priority" }
        - in: query
          name: assignedTo
          schema: { type: string }
        - in: query
          name: sampleType
          schema: { type: string }
        - in: query
          name: sortBy
          schema: { type: string, enum: [submittedAt, priority, receivedDate], default: submittedAt }
        - in: query
          name: sortOrder
          schema: { type: string, enum: [asc, desc], default: asc }
        - in: query
          name: pageSize
          schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
      responses:
        "200":
          description: Queue items.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/DataEnvelope"
                  - properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/TestQueueItem" }

  /tests/bulk-approve:
    post:
      tags: [Tests]
      summary: Bulk approve tests (single transaction)
      operationId: testsBulkApprove
      x-csrf: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [testIds, stage]
              properties:
                testIds:
                  type: array
                  items: { type: string }
                  maxItems: 100
                stage: { $ref: "#/components/schemas/ApprovalStage" }
                comment: { type: string }
      responses:
        "200":
          description: Updated tests.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/DataEnvelope"
                  - properties:
                      data:
                        type: object
                        properties:
                          updated:
                            type: integer

  /tests/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Tests]
      summary: Get one test
      operationId: testsGet
      responses:
        "200":
          description: Test.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/DataEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/Test" }
    patch:
      tags: [Tests]
      summary: Edit test metadata
      operationId: testsUpdate
      x-csrf: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TestUpdateRequest" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/DataEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/Test" }
    delete:
      tags: [Tests]
      summary: Remove a test
      operationId: testsDelete
      x-csrf: true
      responses:
        "204": { description: Deleted. }

  /tests/{id}/parameters:
    parameters:
      - $ref: "#/components/parameters/Id"
    put:
      tags: [Tests]
      summary: Bulk-upsert parameter values; server recomputes per-parameter Pass/Fail
      operationId: testsUpdateParameters
      x-csrf: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [parameters]
              properties:
                parameters:
                  type: array
                  items: { $ref: "#/components/schemas/ParameterValueInput" }
      responses:
        "200":
          description: Updated test (server recomputed statuses).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/DataEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/Test" }

  /tests/{id}/submit:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [Tests]
      summary: Analyst submits for review (422 if any parameter is blank)
      operationId: testsSubmit
      x-csrf: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                comment: { type: string }
      responses:
        "200":
          description: Submitted.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/DataEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/Test" }
        "422":
          $ref: "#/components/responses/ValidationError"

  /tests/{id}/approve:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [Tests]
      summary: Approve at the given stage (advance reviewStatus)
      operationId: testsApprove
      x-csrf: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stage]
              properties:
                stage: { $ref: "#/components/schemas/ApprovalStage" }
                comment: { type: string }
                signaturePng: { type: string, description: "Optional base64-encoded PNG signature." }
      responses:
        "200":
          description: Approved.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/DataEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/Test" }

  /tests/{id}/reject:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [Tests]
      summary: Reject at the given stage (requires `reason`)
      operationId: testsReject
      x-csrf: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stage, reason]
              properties:
                stage: { $ref: "#/components/schemas/ApprovalStage" }
                reason: { type: string, minLength: 1 }
                comment: { type: string }
      responses:
        "200":
          description: Rejected; status → `changes_requested`.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/DataEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/Test" }

  /tests/{id}/history:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Tests]
      summary: Full audit trail of approval actions on one test
      operationId: testsHistory
      responses:
        "200":
          description: History.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/DataEnvelope"
                  - properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/TestReviewEntry" }

  # --------------------------------------------------------------------------
  # Reports
