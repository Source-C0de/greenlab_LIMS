                  - $ref: "#/components/schemas/DataEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/Specification" }

  /specifications/{id}/approve:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [Specifications]
      summary: Approve a Pending specification
      operationId: specificationsApprove
      x-csrf: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                comment: { type: string }
      responses:
        "200":
          description: Approved.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/DataEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/Specification" }

  /specifications/{id}/reject:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [Specifications]
      summary: Reject a Pending specification (reason required)
      operationId: specificationsReject
      x-csrf: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 1 }
                comment: { type: string }
      responses:
        "200":
          description: Rejected.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/DataEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/Specification" }

  /specifications/{id}/versions:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Specifications]
      summary: Full version history
      operationId: specificationsHistory
      responses:
        "200":
          description: Versions.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/DataEnvelope"
                  - properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Specification" }

  # --------------------------------------------------------------------------
  # Inventory — reagents
  # --------------------------------------------------------------------------
  /reagents:
    get:
      tags: [Inventory]
      summary: List reagents
      operationId: reagentsList
      parameters:
        - $ref: "#/components/parameters/Q"
        - in: query
          name: status
          schema: { $ref: "#/components/schemas/ReagentStatus" }
        - in: query
          name: supplier
          schema: { type: string }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Paginated reagents.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedEnvelope"
                  - properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Reagent" }
    post:
      tags: [Inventory]
      summary: Add a new reagent
      operationId: reagentsCreate
      x-csrf: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReagentCreateRequest" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/DataEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/Reagent" }

  /reagents/alerts:
    get:
      tags: [Inventory]
      summary: Low-stock + expired reagents (powers banner)
      operationId: reagentsAlerts
      responses:
        "200":
          description: Alert list.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/DataEnvelope"
                  - properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Reagent" }

  /reagents/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    patch:
      tags: [Inventory]
      summary: Edit non-quantity fields
      operationId: reagentsUpdate
      x-csrf: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReagentUpdateRequest" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/DataEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/Reagent" }

  /reagents/{id}/quantity:
    parameters:
      - $ref: "#/components/parameters/Id"
    patch:
      tags: [Inventory]
      summary: Adjust quantity (status recomputed server-side)
      operationId: reagentsAdjustQuantity
      x-csrf: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantity]
              properties:
                quantity: { type: number }
                reason: { type: string, description: "Free-form note for audit log." }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/DataEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/Reagent" }

  # --------------------------------------------------------------------------
  # Analysts
  # --------------------------------------------------------------------------
  /analysts:
    get:
      tags: [Analysts]
      summary: List analysts
      operationId: analystsList
      responses:
        "200":
          description: Analysts.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/DataEnvelope"
                  - properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Analyst" }
    post:
      tags: [Analysts]
      summary: Add an analyst
      operationId: analystsCreate
      x-csrf: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AnalystCreateRequest" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/DataEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/Analyst" }

  /analysts/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    patch:
      tags: [Analysts]
      summary: Edit analyst fields
      operationId: analystsUpdate
      x-csrf: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AnalystUpdateRequest" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/DataEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/Analyst" }

  /analysts/{id}/signature:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [Analysts]
      summary: Upload signature PNG (multipart)
      operationId: analystsUploadSignature
      x-csrf: true
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Uploaded; signatureUrl populated.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/DataEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/Analyst" }

  # --------------------------------------------------------------------------
  # Notifications
  # --------------------------------------------------------------------------
  /notifications:
    get:
      tags: [Notifications]
      summary: List notifications for the current user
      operationId: notificationsList
      parameters:
        - in: query
          name: unreadOnly
          schema: { type: boolean, default: false }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Paginated notifications.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedEnvelope"
                  - properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Notification" }

  /notifications/{id}/read:
    parameters:
      - $ref: "#/components/parameters/Id"
    patch:
      tags: [Notifications]
      summary: Mark notification as read
      operationId: notificationsMarkRead
      x-csrf: true
      responses:
        "204":
          description: Marked read.

  # --------------------------------------------------------------------------
  # Health & meta
  # --------------------------------------------------------------------------
  /health:
    get:
      tags: [Health]
      summary: Liveness probe (always 200 if process is alive)
      security: []
      operationId: healthLiveness
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [ok] }

  /ready:
    get:
      tags: [Health]
      summary: Readiness probe (DB + Redis reachable)
      security: []
      operationId: healthReadiness
      responses:
        "200":
          description: Ready.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [ok] }
                  checks:
                    type: object
                    additionalProperties: { type: boolean }
        "503":
          description: Not ready.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /version:
    get:
      tags: [Health]
      summary: Backend build version
      security: []
      operationId: healthVersion
      responses:
        "200":
          description: Version info.
          content:
            application/json:
              schema:
                type: object
                properties:
                  version: { type: string }
                  commit: { type: string }
                  builtAt: { type: string, format: date-time }

# ============================================================================
# COMPONENTS
# ============================================================================
components:

  # ---------- Security ----------
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: glims_session
      description: HttpOnly session cookie. See README.md#auth.

  # ---------- Common parameters ----------
  parameters:
    Id:
      in: path
      name: id
      required: true
      schema: { type: string }
      description: ULID/UUID resource id.
    Q:
      in: query
      name: q
      schema: { type: string }
      description: Free-text search across the entity's indexed fields.
    Page:
      in: query
      name: page
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      in: query
      name: pageSize
      schema: { type: integer, minimum: 1, maximum: 200, default: 25 }

  # ---------- Common responses ----------
  responses:
    Unauthorized:
      description: Missing/expired cookie, or wrong scope.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Authenticated but not authorized.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: State conflict (duplicate, invalid transition).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ValidationError:
      description: Input validation failed.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  # ---------- Common envelopes ----------
  schemas:

    # The standard `{ data: ... }` envelope.
    DataEnvelope:
      type: object
      required: [data]
      properties:
        data: {}

    # The `{ data: T[], pagination: { ... } }` envelope.
    PaginatedEnvelope:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items: {}
        pagination:
          type: object
          required: [page, pageSize, total, totalPages]
          properties:
            page: { type: integer, minimum: 1 }
            pageSize: { type: integer, minimum: 1, maximum: 200 }
            total: { type: integer, minimum: 0 }
            totalPages: { type: integer, minimum: 0 }

    # The standard error envelope.
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [unauthorized, forbidden, not_found, validation, conflict, rate_limited, internal]
            message: { type: string }
            details:
              type: object
              additionalProperties: true
            requestId: { type: string }

    # ---------- Shared enums ----------
    Role:
      type: string
      enum: [superadmin, admin, lab_manager, analyst, client, accountant, receptionist]
      description: Seven-role enum. `superadmin` is just a role — no separate path scope.

    Priority:
      type: string
      enum: [Normal, High, Urgent]

    # ---------- Auth ----------
    LoginRequest:
      type: object
      required: [password]
      description: |
        Send exactly one of `username` or `email`. The backend authenticates
        against either column on the users table.
      properties:
        username: { type: string }
        email: { type: string, format: email }
        password: { type: string, format: password }

    LoginResponse:
      type: object
      required: [user, expiresAt]
      properties:
        user: { $ref: "#/components/schemas/User" }
        expiresAt: { type: string, format: date-time }

    RegisterRequest:
      type: object
      required: [labName, contactEmail, contactName]
      properties:
        labName: { type: string }
        labNameAr: { type: string }
        contactName: { type: string }
        contactEmail: { type: string, format: email }
        contactPhone: { type: string }
        message: { type: string }

    User:
      type: object
      required: [id, username, fullName, role, isActive]
      properties:
        id: { type: string }
        username: { type: string }
        email: { type: string, format: email, nullable: true }
        fullName: { type: string }
        fullNameAr: { type: string, nullable: true }
        role: { $ref: "#/components/schemas/Role" }
        isActive: { type: boolean }
        clientId: { type: string, nullable: true, description: "Set when role === 'client'." }
        lastLoginAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    # ---------- Clients ----------
    Client:
      type: object
      required: [id, nameEn, nameAr, type, vatNo, isActive]
      properties:
        id: { type: string }
        nameEn: { type: string }
        nameAr: { type: string }
        type: { type: string }
        vatNo: { type: string, pattern: "^[0-9]{15}$" }
        email: { type: string, format: email, nullable: true }
        phone: { type: string, nullable: true }
        contactPerson: { type: string, nullable: true }
        contactPhone: { type: string, nullable: true }
        address: { type: string, nullable: true }
        city: { type: string, nullable: true }
        crNumber: { type: string, nullable: true }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ClientCreateRequest:
      type: object
      required: [nameEn, nameAr, type, vatNo]
      properties:
        nameEn: { type: string }
        nameAr: { type: string }
        type: { type: string }
        vatNo: { type: string, pattern: "^[0-9]{15}$" }
        email: { type: string, format: email }
        phone: { type: string }
        contactPerson: { type: string }
        contactPhone: { type: string }
        address: { type: string }
        city: { type: string }
        crNumber: { type: string }

    ClientUpdateRequest:
      type: object
      properties:
        nameEn: { type: string }
        nameAr: { type: string }
        type: { type: string }
        vatNo: { type: string, pattern: "^[0-9]{15}$" }
        email: { type: string, format: email }
        phone: { type: string }
        contactPerson: { type: string }
        contactPhone: { type: string }
        address: { type: string }
        city: { type: string }
        crNumber: { type: string }
        isActive: { type: boolean }

    # ---------- Samples ----------
    SampleStatus:
      type: string
      enum: [Received, "In Progress", "Awaiting Approval", Approved, Rejected, "On Hold", Completed]

    Sample:
      type: object
      required: [id, clientId, clientName, sampleType, description, status, receivedDate, priority, tests]
      properties:
        id:
          type: string
          pattern: "^[A-Z]{2,4}/[0-9]{4}/[0-9]{4,6}$"
          description: 'Format: PREFIX/YYYY/NNNN. Server-minted.'
        clientId: { type: string }
        clientName: { type: string, description: "Denormalized from clients.nameEn." }
        sampleType: { type: string }
        description: { type: string }
        status: { $ref: "#/components/schemas/SampleStatus" }
        assignedAnalyst: { type: string, nullable: true }
        receivedDate: { type: string, format: date }
        completedDate: { type: string, format: date, nullable: true }
        priority: { $ref: "#/components/schemas/Priority" }
        tests:
          type: array
          items: { $ref: "#/components/schemas/Test" }
        sampleName: { type: string, nullable: true }
        batchNumber: { type: string, nullable: true }
        mfgDate: { type: string, format: date, nullable: true }
        expiryDate: { type: string, format: date, nullable: true }
        environmentalConditions: { type: string, nullable: true }
        storageCondition: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    SampleSummary:
      type: object
      description: Trimmed sample for list views (no nested tests).
      required: [id, clientId, clientName, sampleType, status, receivedDate, priority]
      properties:
        id: { type: string }
        clientId: { type: string }
        clientName: { type: string }
        sampleType: { type: string }
        description: { type: string }
        status: { $ref: "#/components/schemas/SampleStatus" }
        assignedAnalyst: { type: string, nullable: true }
        receivedDate: { type: string, format: date }
        priority: { $ref: "#/components/schemas/Priority" }
        testCount: { type: integer }

    SampleCreateRequest:
      type: object
      required: [clientId, sampleType, description, receivedDate, priority]
      properties:
        clientId: { type: string }
        sampleType: { type: string }
        description: { type: string }
        priority: { $ref: "#/components/schemas/Priority" }
        receivedDate: { type: string, format: date }
        sampleName: { type: string }
        batchNumber: { type: string }
        mfgDate: { type: string, format: date }
        expiryDate: { type: string, format: date }
        environmentalConditions: { type: string }
        storageCondition: { type: string }
        tests:
          type: array
          description: Optional initial tests to copy from a specification.
          items: { $ref: "#/components/schemas/TestCreateRequest" }

    SampleUpdateRequest:
      type: object
      properties:
        description: { type: string }
        assignedAnalyst: { type: string, nullable: true }
        priority: { $ref: "#/components/schemas/Priority" }
        sampleName: { type: string }
        batchNumber: { type: string }
        mfgDate: { type: string, format: date }
        expiryDate: { type: string, format: date }
        environmentalConditions: { type: string }
        storageCondition: { type: string }

    SampleReport:
      allOf:
        - $ref: "#/components/schemas/Sample"
        - type: object
          properties:
            client:
              $ref: "#/components/schemas/Client"
            parametersSnapshot:
              type: array
              items: { $ref: "#/components/schemas/ParameterValue" }

    TimelineEvent:
      type: object
      required: [id, sampleId, stage, enteredAt, exitedAt, byUserId]
      properties:
        id: { type: string }
        sampleId: { type: string }
        stage: { type: string }
        enteredAt: { type: string, format: date-time }
        exitedAt: { type: string, format: date-time, nullable: true }
        byUserId: { type: string }

    # ---------- Tests ----------
    TestReviewStatus:
      type: string
      enum: [pending, in_progress, changes_requested, awaiting_lab_supervisor, awaiting_tech_manager, awaiting_qa, qa_approved]

    ApprovalStage:
      type: string
      enum: [lab_supervisor, tech_manager, qa]

    ParameterStatus:
      type: string
      enum: [pending, pass, fail]

    Test:
      type: object
      required: [id, sampleId, name, category, method, reviewStatus, parameters, reviewHistory, approvals, createdAt, updatedAt]
      properties:
        id: { type: string }
        sampleId: { type: string }
        name: { type: string }
        category: { type: string }
        method: { type: string }
        assignedTo: { type: string, nullable: true }
        reviewStatus: { $ref: "#/components/schemas/TestReviewStatus" }
        parameters:
          type: array
          items: { $ref: "#/components/schemas/ParameterValue" }
        reviewHistory:
          type: array
          items: { $ref: "#/components/schemas/TestReviewEntry" }
        approvals:
          type: object
          properties:
            lab_supervisor: { $ref: "#/components/schemas/StageApproval", nullable: true }
            tech_manager: { $ref: "#/components/schemas/StageApproval", nullable: true }
            qa: { $ref: "#/components/schemas/StageApproval", nullable: true }
        submittedAt: { type: string, format: date-time, nullable: true }
        qaApprovedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    TestCreateRequest:
      type: object
      required: [name, category, method]
      properties:
        name: { type: string }
        category: { type: string }
        method: { type: string }
        assignedTo: { type: string }
        parameters:
          type: array
          items: { $ref: "#/components/schemas/ParameterValueInput" }

    TestUpdateRequest:
      type: object
      properties:
        name: { type: string }
        category: { type: string }
        method: { type: string }
        assignedTo: { type: string, nullable: true }

    TestQueueItem:
      type: object
      required: [testId, sampleId, sampleType, clientName, name, method, priority, assignedTo, reviewStatus, submittedAt]
      properties:
        testId: { type: string }
        sampleId: { type: string }
        sampleType: { type: string }
        clientName: { type: string }
        name: { type: string }
        method: { type: string }
        priority: { $ref: "#/components/schemas/Priority" }
        assignedTo: { type: string, nullable: true }
        reviewStatus: { $ref: "#/components/schemas/TestReviewStatus" }
        submittedAt: { type: string, format: date-time }
        receivedDate: { type: string, format: date }

    ParameterValue:
      type: object
      required: [id, name, value, unit, status]
      properties:
        id: { type: string }
        name: { type: string }
        value:
          type: string
          nullable: true
        unit: { type: string }
        min: { type: number, nullable: true }
        max: { type: number, nullable: true }
        target: { type: number, nullable: true }
        limitType:
          type: string
          nullable: true
          enum: [Range, "Max Only", "Min Only", "Exact Value", "Pass / Fail", Text, "Not Detected"]
        reference: { type: string, nullable: true }
        mu: { type: string, nullable: true }
        status: { $ref: "#/components/schemas/ParameterStatus" }
        note: { type: string, nullable: true }

    ParameterValueInput:
      type: object
      required: [id, value]
      properties:
        id: { type: string }
        value: { type: string, nullable: true }
        note: { type: string }

    TestReviewEntry:
      type: object
      required: [id, testId, reviewerId, reviewerEmail, decision, previousReviewStatus, newReviewStatus, createdAt]
      properties:
        id: { type: string }
        testId: { type: string }
        reviewerId: { type: string }
        reviewerEmail: { type: string }
        reviewerName: { type: string, nullable: true }
        reviewerRole: { $ref: "#/components/schemas/Role" }
        decision:
          type: string
          enum: [approved, changes_requested]
        stage: { $ref: "#/components/schemas/ApprovalStage" }
        reason: { type: string, nullable: true }
        comment: { type: string, nullable: true }
        previousReviewStatus: { $ref: "#/components/schemas/TestReviewStatus" }
        newReviewStatus: { $ref: "#/components/schemas/TestReviewStatus" }
        createdAt: { type: string, format: date-time }

    StageApproval:
      type: object
      required: [stage, approverRole, approverName, approverId, approverEmail, approvedAt]
      properties:
        stage: { $ref: "#/components/schemas/ApprovalStage" }
        approverRole: { $ref: "#/components/schemas/Role" }
        approverName: { type: string }
        approverId: { type: string }
        approverEmail: { type: string }
        approvedAt: { type: string, format: date-time }
        comment: { type: string, nullable: true }

    # ---------- Reports ----------
    ReportStatus:
      type: string
      enum: [Draft, Final, Re-issued, Supplement]

    Report:
      type: object
      required: [id, sampleId, reportNumber, status, createdAt, updatedAt]
      properties:
        id: { type: string }
        sampleId: { type: string }
        reportNumber: { type: string }
        status: { $ref: "#/components/schemas/ReportStatus" }
        analystId: { type: string, nullable: true }
        reviewerId: { type: string, nullable: true }
        analystSignatureUrl: { type: string, nullable: true, format: uri }
        reviewerSignatureUrl: { type: string, nullable: true, format: uri }
        issuedAt: { type: string, format: date, nullable: true }
        pdfUrl: { type: string, nullable: true, format: uri }
        parametersSnapshot:
          type: array
          items: { $ref: "#/components/schemas/ParameterValue" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ReportUpdateRequest:
      type: object
      properties:
        status: { $ref: "#/components/schemas/ReportStatus" }
        reviewerId: { type: string }

    # ---------- Invoices ----------
    InvoiceStatus:
      type: string
      enum: [Draft, Pending, Paid, Overdue, Cancelled]

    InvoiceType:
      type: string
      enum: ["Tax Invoice", "Simplified Tax Invoice"]

    Invoice:
      type: object
      required: [id, clientId, clientName, issueDate, dueDate, subtotal, vat, total, status, vatNo, uuid, hash, qrCode, invoiceType, isReported]
      properties:
        id: { type: string, pattern: "^INV-[0-9]{4}-[0-9]{4,6}$" }
        clientId: { type: string }
        clientName: { type: string }
        sampleId: { type: string, nullable: true }
        issueDate: { type: string, format: date }
        dueDate: { type: string, format: date }
        subtotal: { type: number }
        vat: { type: number }
        total: { type: number }
        status: { $ref: "#/components/schemas/InvoiceStatus" }
        vatNo: { type: string, pattern: "^[0-9]{15}$" }
        uuid: { type: string, format: uuid, description: "ZATCA UUID. Server-generated." }
        hash: { type: string, description: "ZATCA SHA-256 hash. Server-generated." }
        qrCode: { type: string, description: "Base64 TLV-encoded QR per ZATCA spec." }
        invoiceType: { $ref: "#/components/schemas/InvoiceType" }
        isReported: { type: boolean }
        reportedAt: { type: string, format: date-time, nullable: true }
        irn: { type: string, nullable: true, description: "ZATCA Invoice Reference Number." }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    InvoiceCreateRequest:
      type: object
      required: [clientId, sampleId, dueDate, lines]
      properties:
        clientId: { type: string }
        sampleId: { type: string, nullable: true }
        dueDate: { type: string, format: date }
        invoiceType: { $ref: "#/components/schemas/InvoiceType" }
        lines:
          type: array
          minItems: 1
          items:
            type: object
            required: [description, quantity, unitPrice]
            properties:
              description: { type: string }
              quantity: { type: number }
              unitPrice: { type: number }

    InvoiceUpdateRequest:
      type: object
      properties:
        dueDate: { type: string, format: date }
        lines:
          type: array
          items:
            type: object
            required: [description, quantity, unitPrice]
            properties:
              description: { type: string }
              quantity: { type: number }
              unitPrice: { type: number }

    # ---------- Accounting ----------
    AccountType:
      type: string
      enum: [Asset, Liability, Equity, Revenue, Expense]

    Account:
      type: object
      required: [id, nameEn, nameAr, type, isActive]
      properties:
        id: { type: string, description: "Account code, e.g. '1100'." }
        nameEn: { type: string }
        nameAr: { type: string }
        type: { $ref: "#/components/schemas/AccountType" }
        parentId: { type: string, nullable: true }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    AccountCreateRequest:
      type: object
      required: [id, nameEn, nameAr, type]
      properties:
        id: { type: string }
        nameEn: { type: string }
        nameAr: { type: string }
        type: { $ref: "#/components/schemas/AccountType" }
        parentId: { type: string }

    JournalStatus:
      type: string
      enum: [Draft, Posted, Reversed]

    JournalSourceType:
      type: string
      enum: [invoice, payment, expense, manual]

    JournalLine:
      type: object
      required: [id, entryId, accountId, debit, credit]
      properties:
        id: { type: string }
        entryId: { type: string }
        accountId: { type: string }
        debit: { type: number }
        credit: { type: number }
        description: { type: string, nullable: true }
        costCenter: { type: string, nullable: true }

    JournalEntry:
      type: object
      required: [id, date, description, status, sourceType, lines, createdAt, updatedAt]
      properties:
        id: { type: string }
        date: { type: string, format: date }
        description: { type: string }
        memo: { type: string, nullable: true }
        status: { $ref: "#/components/schemas/JournalStatus" }
        sourceType: { $ref: "#/components/schemas/JournalSourceType" }
        sourceId: { type: string, nullable: true }
        postedById: { type: string, nullable: true }
        postedAt: { type: string, format: date-time, nullable: true }
        lines:
          type: array
          items: { $ref: "#/components/schemas/JournalLine" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    JournalCreateRequest:
      type: object
      required: [date, description, lines]
      properties:
        date: { type: string, format: date }
        description: { type: string }
        memo: { type: string }
        lines:
          type: array
          minItems: 2
          items:
            type: object
            required: [accountId, debit, credit]
            properties:
              accountId: { type: string }
              debit: { type: number, default: 0 }
              credit: { type: number, default: 0 }
              description: { type: string }
              costCenter: { type: string }

    JournalUpdateRequest:
      type: object
      properties:
        date: { type: string, format: date }
        description: { type: string }
        memo: { type: string }
        lines:
          type: array
          items:
            type: object
            required: [accountId, debit, credit]
            properties:
              accountId: { type: string }
              debit: { type: number, default: 0 }
              credit: { type: number, default: 0 }
              description: { type: string }
              costCenter: { type: string }

    LedgerLine:
      type: object
      required: [entryId, date, description, debit, credit, balance]
      properties:
        entryId: { type: string }
        date: { type: string, format: date }
        description: { type: string }
        debit: { type: number }
        credit: { type: number }
        balance: { type: number, description: "Running balance after this line." }
        journalId: { type: string }

    Expense:
      type: object
      required: [id, date, category, description, amount, vatAmount, total, status]
      properties:
        id: { type: string }
        date: { type: string, format: date }
        category: { type: string }
        description: { type: string }
        amount: { type: number }
        vatAmount: { type: number }
        total: { type: number }
        vendor: { type: string, nullable: true }
        receiptUrl: { type: string, nullable: true, format: uri }
        status: { type: string, enum: [Draft, Posted, Reimbursed] }
        createdById: { type: string }
        journalEntryId: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ExpenseCreateRequest:
      type: object
      required: [date, category, description, amount]
      properties:
        date: { type: string, format: date }
        category: { type: string }
        description: { type: string }
        amount: { type: number }
        vendor: { type: string }
        receiptUrl: { type: string, format: uri }

    PnlReport:
      type: object
      required: [period, revenue, cogs, grossProfit, operatingExpenses, operatingIncome, netIncome, lines]
      properties:
        period: { type: string, example: "2026-09" }
        revenue: { type: number }
        cogs: { type: number }
        grossProfit: { type: number }
        operatingExpenses: { type: number }
        operatingIncome: { type: number }
        netIncome: { type: number }
        lines:
          type: array
          items:
            type: object
            properties:
              accountId: { type: string }
              accountNameEn: { type: string }
              amount: { type: number }

    BalanceSheet:
      type: object
      required: [asOf, assets, liabilities, equity, totalAssets, totalLiabilities, totalEquity, lines]
      properties:
        asOf: { type: string, format: date }
        assets: { type: number }
        liabilities: { type: number }
        equity: { type: number }
        totalAssets: { type: number }
        totalLiabilities: { type: number }
        totalEquity: { type: number }
        lines:
          type: array
          items:
            type: object
            properties:
              accountId: { type: string }
              accountNameEn: { type: string }
              type: { $ref: "#/components/schemas/AccountType" }
              amount: { type: number }

    CashFlowReport:
      type: object
      required: [period, operating, investing, financing, netChange, openingCash, closingCash]
      properties:
        period: { type: string, example: "2026-09" }
        operating: { type: number }
        investing: { type: number }
        financing: { type: number }
        netChange: { type: number }
        openingCash: { type: number }
        closingCash: { type: number }
        lines:
          type: array
          items:
            type: object
            properties:
              section: { type: string, enum: [operating, investing, financing] }
              accountId: { type: string }
              accountNameEn: { type: string }
              amount: { type: number }

    # ---------- Specifications ----------
    SpecificationStatus:
      type: string
      enum: [Draft, "Pending Approval", Approved, Rejected, Superseded]

    SpecParameter:
      type: object
      required: [id, specificationId, name, unit, limitType]
      properties:
        id: { type: string }
        specificationId: { type: string }
        name: { type: string }
        method: { type: string, nullable: true }
        unit: { type: string }
        min: { type: number, nullable: true }
        max: { type: number, nullable: true }
        target: { type: number, nullable: true }
        limitType:
          type: string
          enum: [Range, "Max Only", "Min Only", "Exact Value", "Pass / Fail", Text, "Not Detected"]
        reference: { type: string, nullable: true }
        mu: { type: string, nullable: true }

    Specification:
      type: object
      required: [id, code, nameEn, nameAr, category, version, status, parameters, tests, issuanceDate]
      properties:
        id: { type: string }
        code: { type: string }
        nameEn: { type: string }
        nameAr: { type: string }
        category: { type: string }
        version: { type: integer, minimum: 1 }
        status: { $ref: "#/components/schemas/SpecificationStatus" }
        parameters:
          type: array
          items: { $ref: "#/components/schemas/SpecParameter" }
        tests:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              testCode: { type: string }
              testName: { type: string }
              testParameter: { type: string }
              methodType: { type: string }
              methodReference: { type: string }
              sampleType: { type: string }
              referenceNo: { type: string }
              sopCode: { type: string }
              warehouseItems: { type: string }
              parameterDetails: { type: string, nullable: true }
        issuanceDate: { type: string, format: date }
        createdById: { type: string }
        approvedById: { type: string, nullable: true }
        approvedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    SpecificationCreateRequest:
      type: object
      required: [code, nameEn, nameAr, category, issuanceDate]
      properties:
        code: { type: string }
        nameEn: { type: string }
        nameAr: { type: string }
        category: { type: string }
        issuanceDate: { type: string, format: date }
        parameters:
          type: array
          items: { $ref: "#/components/schemas/SpecParameter" }
        tests:
          type: array
          items:
            type: object
            properties:
              testCode: { type: string }
              testName: { type: string }
              testParameter: { type: string }
              methodType: { type: string }
              methodReference: { type: string }
              sampleType: { type: string }
              referenceNo: { type: string }
              sopCode: { type: string }

    SpecificationUpdateRequest:
      type: object
      properties:
        code: { type: string }
        nameEn: { type: string }
        nameAr: { type: string }
        category: { type: string }
        issuanceDate: { type: string, format: date }
        parameters:
          type: array
          items: { $ref: "#/components/schemas/SpecParameter" }
        tests:
          type: array
          items:
            type: object
            properties:
              testCode: { type: string }
              testName: { type: string }
              testParameter: { type: string }
              methodType: { type: string }
              methodReference: { type: string }
              sampleType: { type: string }
              referenceNo: { type: string }
              sopCode: { type: string }

    # ---------- Inventory ----------
    ReagentStatus:
      type: string
      enum: [OK, "Low Stock", Expired]
      description: Computed server-side from quantity + expiryDate.

    Reagent:
      type: object
      required: [id, nameEn, nameAr, catalogNo, quantity, unit, minQuantity, expiryDate, status]
      properties:
        id: { type: string }
        nameEn: { type: string }
        nameAr: { type: string }
        catalogNo: { type: string }
        supplier: { type: string, nullable: true }
        quantity: { type: number }
        unit: { type: string }
        minQuantity: { type: number }
        expiryDate: { type: string, format: date }
        location: { type: string, nullable: true }
        costPerUnit: { type: number, nullable: true }
        status: { $ref: "#/components/schemas/ReagentStatus" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ReagentCreateRequest:
      type: object
      required: [nameEn, nameAr, catalogNo, quantity, unit, minQuantity, expiryDate]
      properties:
        nameEn: { type: string }
        nameAr: { type: string }
        catalogNo: { type: string }
        supplier: { type: string }
        quantity: { type: number }
        unit: { type: string }
        minQuantity: { type: number }
        expiryDate: { type: string, format: date }
        location: { type: string }
        costPerUnit: { type: number }

    ReagentUpdateRequest:
      type: object
      properties:
        nameEn: { type: string }
        nameAr: { type: string }
        catalogNo: { type: string }
        supplier: { type: string }
        unit: { type: string }
        minQuantity: { type: number }
        expiryDate: { type: string, format: date }
        location: { type: string }
        costPerUnit: { type: number }

    # ---------- Analysts ----------
    Analyst:
      type: object
      required: [id, fullName, email, isActive]
      properties:
        id: { type: string }
        userId: { type: string, nullable: true }
        fullName: { type: string }
        fullNameAr: { type: string, nullable: true }
        email: { type: string, format: email }
        signatureUrl: { type: string, nullable: true, format: uri }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    AnalystCreateRequest:
      type: object
      required: [fullName, email]
      properties:
        fullName: { type: string }
        fullNameAr: { type: string }
        email: { type: string, format: email }
        userId: { type: string }

    AnalystUpdateRequest:
      type: object
      properties:
        fullName: { type: string }
        fullNameAr: { type: string }
        email: { type: string, format: email }
        isActive: { type: boolean }

    # ---------- Notifications ----------
    Notification:
      type: object
      required: [id, type, title, createdAt]
      properties:
        id: { type: string }
        userId: { type: string, nullable: true }
        role: { $ref: "#/components/schemas/Role" }
        type: { type: string }
        title: { type: string }
        body: { type: string, nullable: true }
        link: { type: string, nullable: true }
        readAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }

    # ---------- Tenants & SaaS ----------
    TenantStatus:
      type: string
      enum: [active, trial, suspended, cancelled]

    PlanCode:
      type: string
      enum: [starter, professional, enterprise]

    Tenant:
      type: object
      required: [id, name, nameAr, slug, planCode, status, contactEmail, billingCycle]
      properties:
        id: { type: string }
        name: { type: string }
        nameAr: { type: string }
        slug: { type: string, pattern: "^[a-z0-9-]+$" }
        planCode: { $ref: "#/components/schemas/PlanCode" }
        status: { $ref: "#/components/schemas/TenantStatus" }
        contactEmail: { type: string, format: email }
        contactPhone: { type: string, nullable: true }
        crNumber: { type: string, nullable: true }
        vatNumber: { type: string, nullable: true }
        city: { type: string, nullable: true }
        region: { type: string, nullable: true }
        billingCycle: { type: string, enum: [monthly, yearly] }
        trialEndsAt: { type: string, format: date-time, nullable: true }
        suspensionReason: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    TenantCreateRequest:
      type: object
      required: [name, nameAr, slug, planCode, contactEmail, billingCycle]
      properties:
        name: { type: string }
        nameAr: { type: string }
        slug: { type: string, pattern: "^[a-z0-9-]+$" }
        planCode: { $ref: "#/components/schemas/PlanCode" }
        contactEmail: { type: string, format: email }
        contactPhone: { type: string }
        crNumber: { type: string }
        vatNumber: { type: string }
        city: { type: string }
        region: { type: string }
        billingCycle: { type: string, enum: [monthly, yearly] }

    TenantUpdateRequest:
      type: object
      properties:
        name: { type: string }
        nameAr: { type: string }
        slug: { type: string }
        planCode: { $ref: "#/components/schemas/PlanCode" }
        contactEmail: { type: string, format: email }
        contactPhone: { type: string }
        crNumber: { type: string }
        vatNumber: { type: string }
        city: { type: string }
        region: { type: string }
        billingCycle: { type: string, enum: [monthly, yearly] }

    Plan:
      type: object
      required: [code, nameEn, nameAr, priceMonthly, priceYearly, isActive]
      properties:
        code: { $ref: "#/components/schemas/PlanCode" }
        nameEn: { type: string }
        nameAr: { type: string }
        priceMonthly: { type: number }
        priceYearly: { type: number }
        features:
          type: array
          items: { type: string }
        isActive: { type: boolean }

    FeatureFlag:
      type: object
      required: [key, enabled, updatedAt]
      properties:
        key: { type: string }
        enabled: { type: boolean }
        description: { type: string, nullable: true }
        updatedAt: { type: string, format: date-time }
        updatedById: { type: string, nullable: true }

    MenuItem:
      type: object
      required: [id, key, href, labelEn, labelAr, section, sortOrder, isEnabled, isSystem]
      properties:
        id: { type: string }
        key: { type: string }
        href: { type: string }
        parentKey: { type: string, nullable: true }
        icon: { type: string, nullable: true, description: "Lucide icon name." }
        labelEn: { type: string }
        labelAr: { type: string }
        section:
          type: string
          enum: [main, accounting, specifications, client_portal, settings]
        sortOrder: { type: integer }
        isEnabled: { type: boolean }
        isSystem: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    PermissionMatrix:
      type: object
      required: [roles, menuItems, cells]
      properties:
        roles:
          type: array
          items:
            type: object
            required: [code, nameEn, nameAr, isSystem]
            properties:
              code: { $ref: "#/components/schemas/Role" }
              nameEn: { type: string }
              nameAr: { type: string }
              descriptionEn: { type: string, nullable: true }
              descriptionAr: { type: string, nullable: true }
              isSystem: { type: boolean }
        menuItems:
          type: array
          items: { $ref: "#/components/schemas/MenuItem" }
        cells:
          type: array
          items:
            type: object
            required: [roleCode, menuItemKey, enabled]
            properties:
              roleCode: { $ref: "#/components/schemas/Role" }
              menuItemKey: { type: string }
              enabled: { type: boolean }