                  - properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/JournalEntry" }
    post:
      tags: [Accounting]
      summary: Manual journal entry (debits must equal credits)
      operationId: journalsCreate
      x-csrf: true
      requestBody:
        required: true
        content:
