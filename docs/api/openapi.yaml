            schema: { $ref: "#/components/schemas/JournalCreateRequest" }
      responses:
        "201":
          description: Created (Draft).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/DataEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/JournalEntry" }
        "422":
          description: Lines don't balance.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /journals/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
