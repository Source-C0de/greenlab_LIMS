  /reports:
    get:
      tags: [Reports]
      summary: List reports
      operationId: reportsList
      parameters:
        - $ref: "#/components/parameters/Q"
        - in: query
          name: status
          schema: { $ref: "#/components/schemas/ReportStatus" }
        - in: query
          name: analyst
          schema: { type: string }
        - in: query
          name: from
          schema: { type: string, format: date }
        - in: query
          name: to
          schema: { type: string, format: date }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Paginated reports.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedEnvelope"
                  - properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Report" }
    post:
      tags: [Reports]
      summary: Publish a report from a fully-approved sample
      operationId: reportsCreate
      x-csrf: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sampleId]
              properties:
                sampleId: { type: string }
      responses:
        "201":
          description: Report created.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/DataEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/Report" }

  /reports/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Reports]
      summary: Get one report
      operationId: reportsGet
      parameters:
        - in: query
          name: expand
          schema: { type: array, items: { type: string, enum: [sample, client] } }
      responses:
        "200":
          description: Report.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/DataEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/Report" }
    patch:
      tags: [Reports]
      summary: Status transition (Draft → Final / Re-issued / Supplement)
      operationId: reportsUpdate
      x-csrf: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReportUpdateRequest" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/DataEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/Report" }

  # --------------------------------------------------------------------------
  # Invoices
  # --------------------------------------------------------------------------
  /invoices:
    get:
      tags: [Invoices]
      summary: List invoices
      operationId: invoicesList
      parameters:
        - $ref: "#/components/parameters/Q"
        - in: query
          name: status
          schema: { $ref: "#/components/schemas/InvoiceStatus" }
        - in: query
          name: clientId
          schema: { type: string }
        - in: query
          name: isReported
          schema: { type: boolean }
        - in: query
          name: from
          schema: { type: string, format: date }
        - in: query
          name: to
          schema: { type: string, format: date }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Paginated invoices.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedEnvelope"
                  - properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Invoice" }
    post:
      tags: [Invoices]
      summary: Create invoice (auto-posts AR + Revenue + Output VAT journal entry)
      operationId: invoicesCreate
      x-csrf: true
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InvoiceCreateRequest" }
      responses:
        "201":
          description: Invoice created.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/DataEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/Invoice" }

  /invoices/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Invoices]
      summary: Get one invoice
      operationId: invoicesGet
      responses:
        "200":
          description: Invoice.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/DataEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/Invoice" }
    patch:
      tags: [Invoices]
      summary: Edit metadata (Draft only)
      operationId: invoicesUpdate
      x-csrf: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InvoiceUpdateRequest" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/DataEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/Invoice" }
    delete:
      tags: [Invoices]
      summary: Soft-delete (Draft only)
      operationId: invoicesDelete
      x-csrf: true
      responses:
        "204": { description: Soft-deleted. }

  /invoices/{id}/report-zatca:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [Invoices]
      summary: Server calls ZATCA FATOORA; returns `{ irn }`
      operationId: invoicesReportZatca
      x-csrf: true
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string }
          description: Required to prevent double-reporting on retry.
      responses:
        "200":
          description: Reported. Body has IRN.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/DataEnvelope"
                  - properties:
                      data:
                        type: object
                        required: [irn]
                        properties:
                          irn: { type: string }
        "409":
          description: Already reported or invoice not in a reportable state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /invoices/{id}/payment:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [Invoices]
      summary: Record payment (auto-posts Cash + AR journal entry)
      operationId: invoicesRecordPayment
      x-csrf: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, paidAt]
              properties:
                amount: { type: number, format: float, minimum: 0 }
                paidAt: { type: string, format: date }
                method: { type: string, enum: [bank_transfer, cash, card, check] }
                reference: { type: string }
      responses:
        "200":
          description: Payment recorded.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/DataEnvelope"
                  - properties:
                      data: { $ref: "#/components/schemas/Invoice" }

